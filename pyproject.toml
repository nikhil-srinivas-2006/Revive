[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "revive-local"
version = "0.1.0"
description = "Local, non-destructive photo processing automation"
requires-python = ">=3.11,<3.15"
dependencies = ["Pillow>=12.1.1,<14", "watchdog>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
revive = "revive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

