[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "revive-local"
version = "0.1.0"
description = "Local, non-destructive photo processing automation"
requires-python = ">=3.11,<3.15"
dependencies = ["Pillow>=12.1.1,<14", "watchdog>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
colorization = ["torch>=2.6,<3", "numpy>=2,<3", "opencv-python-headless>=4.10,<5"]

[project.scripts]
revive = "revive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/revive/_vendor"]

[tool.setuptools.package-data]
"revive._vendor.ddcolor" = ["LICENSE*", "NOTICE.md", "upstream.json"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "colorization" }]

