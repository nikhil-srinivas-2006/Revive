# Copy to config.local.toml and choose three disjoint absolute paths.
# Replace these environment references with absolute paths, or set the variables.
# Automatically select colorization and upscaling for each incoming photo.
# Install both local checkpoints once during setup (see README).
schema_version = 1

[paths]
input = "${REVIVE_INPUT_DIR}"
output = "${REVIVE_OUTPUT_DIR}"
app_data = "${LOCALAPPDATA}/Revive"

[watch]
recursive = true
process_existing = true
quiet_seconds = 10
stable_samples = 3
sample_seconds = 5
reconcile_seconds = 300

[pipeline]
adapter = "normalize_png"
# Optional cleanup: 0 disables it. Values above 0.25 are rejected.
denoise_strength = 0
contrast_strength = 0

[colorization]
# Enabled means inspect every photo, not colorize every photo.
enabled = true
model = "ddcolor_modelscope"
strength = 0.85
# Sepia is ambiguous; keep disabled until results have been reviewed.
include_sepia = false
input_size = 512

[super_resolution]
# Upscale only below target_long_edge, at most 2x per source.
enabled = true
model = "realesrgan_x2plus"
target_long_edge = 4096
tile_size = 128

[resources]
max_source_mib = 512
max_input_megapixels = 40
max_output_megapixels = 64
max_pending_jobs = 1000
min_free_disk_mib = 512
worker_timeout_seconds = 1800
# 0 = conservative automatic budget from total/available physical RAM.
worker_memory_mib = 0
cpu_threads = 2

[retry]
max_attempts = 4
delays_seconds = [60, 300, 1800]

